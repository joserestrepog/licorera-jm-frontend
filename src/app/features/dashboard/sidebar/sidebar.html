<aside class="sidebar">
  <div class="sidebar-brand">
    <img src="/favicon.ico" alt="Licorera JM" class="sidebar-logo" />

    <div class="brand-text">
      <span class="brand-name">Licorera JM</span>
      <span class="brand-subtitle">Sistema de gestión</span>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <nav class="sidebar-nav">
    <span class="nav-section-title">Principal</span>

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <svg lucideHouse class="nav-icon" [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>

      <span>Dashboard</span>
    </a>

    <a
      href="#"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
      (click)="goToSales(); $event.preventDefault()"
    >
      <svg
        lucideShoppingCart
        class="nav-icon"
        [size]="20"
        [strokeWidth]="1.8"
        aria-hidden="true"
      ></svg>

      <span>Vender</span>
    </a>

    <a routerLink="/inventory" routerLinkActive="active" class="nav-item">
      <svg lucideBoxes class="nav-icon" [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>

      <span>Inventario</span>
    </a>

    <a routerLink="/products" routerLinkActive="active" class="nav-item">
      <svg lucidePackage class="nav-icon" [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>

      <span>Productos</span>
    </a>

    <a routerLink="/categories" routerLinkActive="active" class="nav-item">
      <svg lucideTags class="nav-icon" [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>

      <span>Categorías</span>
    </a>

    <a routerLink="/cash-register" routerLinkActive="active" class="nav-item">
      <svg
        lucideWalletCards
        class="nav-icon"
        [size]="20"
        [strokeWidth]="1.8"
        aria-hidden="true"
      ></svg>

      <span>Caja</span>
    </a>

    @if (isAdmin()) {
      <span class="nav-section-title">Administración</span>

      <a routerLink="/report" routerLinkActive="active" class="nav-item">
        <svg
          lucideChartNoAxesCombined
          class="nav-icon"
          [size]="20"
          [strokeWidth]="1.8"
          aria-hidden="true"
        ></svg>

        <span>Reportes</span>
      </a>

      <a routerLink="/users" routerLinkActive="active" class="nav-item">
        <svg lucideUsers class="nav-icon" [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>

        <span>Usuarios</span>
      </a>

      <a routerLink="/backups" routerLinkActive="active" class="nav-item">
        <svg
          lucideDatabaseBackup
          class="nav-icon"
          [size]="20"
          [strokeWidth]="1.8"
          aria-hidden="true"
        ></svg>

        <span>Respaldos</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="logout-button" (click)="logout()">
      <svg lucideLogOut class="nav-icon" [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>

      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>

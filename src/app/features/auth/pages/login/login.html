<div>
  <h1>Licorera JM</h1>
  <h2>Iniciar sesión</h2>

  <form (ngSubmit)="login()">

    <div>
      <label for="username">Usuario</label>
      <input
        id="username"
        type="text"
        name="username"
        [(ngModel)]="loginRequest.username"
        required
      />
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="loginRequest.password"
        required
      />
    </div>

    <button type="submit">
      Ingresar
    </button>

  </form>
</div>

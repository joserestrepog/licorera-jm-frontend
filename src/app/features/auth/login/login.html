<div class="login-page">
  <div class="login-card">
    <!-- LOGO -->
    <div class="brand">
      <img src="/images/logo-licorera-jm.png" alt="Licorera JM" class="logo" />
    </div>

    <!-- SEPARADOR -->
    <div class="gold-line"></div>

    <!-- ENCABEZADO -->
    <div class="login-header">
      <h2>Iniciar sesión</h2>

      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <!-- FORMULARIO -->
    <form (ngSubmit)="login()">
      <!-- USUARIO -->
      <div class="form-group">
        <label for="username">
          <svg
            lucideUser
            class="field-icon"
            [size]="18"
            [strokeWidth]="1.8"
            aria-hidden="true"
          ></svg>
          Usuario
        </label>

        <input
          id="username"
          type="text"
          name="username"
          placeholder="Ingresa tu usuario"
          [(ngModel)]="loginRequest.username"
          required
        />
      </div>

      <!-- CONTRASEÑA -->
      <div class="form-group">
        <label for="password">
          <svg
            lucideLockKeyhole
            class="field-icon"
            [size]="18"
            [strokeWidth]="1.8"
            aria-hidden="true"
          ></svg>
          Contraseña
        </label>

        <div class="password-wrapper">
          <input
            id="password"
            [type]="passwordVisible ? 'text' : 'password'"
            name="password"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="loginRequest.password"
            required
          />

          <button
            type="button"
            class="password-eye"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (passwordVisible) {
              <svg lucideEye [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>
            } @else {
              <svg lucideEyeOff [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>
            }
          </button>
        </div>
      </div>

      @if (errorMessage) {
        <div class="login-alert" role="alert">
          {{ errorMessage }}
        </div>
      }

      <!-- BOTÓN -->
      <button type="submit">
        <svg lucideLogIn [size]="20" [strokeWidth]="1.8" aria-hidden="true"></svg>

        Ingresar
      </button>
    </form>

    <!-- FOOTER -->
    <div class="login-footer">
      <span></span>

      <p>© {{ currentYear }} Licorera JM</p>

      <span></span>
    </div>
  </div>
</div>
